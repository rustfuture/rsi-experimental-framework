[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-experimental-framework"
version = "0.3.0"
description = "Reproducible harness for iterative candidate generation and selection"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["rsi_framework*"]
