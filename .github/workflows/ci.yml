name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce first run byte-level
        run: |
          python -m rsi_framework --config config/default.json --output /tmp/rsi-replay
          cmp results/first_run.json /tmp/rsi-replay/first_run.json
      - name: Execute multi-seed and ablation benchmarks
        run: python -m rsi_framework --run-all-benchmarks --output /tmp/rsi-benchmarks
